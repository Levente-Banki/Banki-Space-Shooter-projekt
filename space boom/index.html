<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space boom</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="title">
            <img src="asset/TitleLogo.png" alt="">
            <h1>
                Best score: --
            </h1>
        </div>
        <div class="middleMenu">
            <div class="difficulty ">
                <img src="asset/button_difficulty.png" class="leftRotate" alt="">

                    Difficulty
                </h2>
            </div>
            <div class="play">
                <img src="asset/button_play.png" class="rightRotate" alt="">

                    Play now
                </h2>
            </div>
            <div class="shop">
                <img src="asset/button_shop.png" class="rightRotate" alt="">

                    Shop
                </h2>
            </div>
        </div>
        <div class="bottomMenu">
            <div>

                    Rules
                </h3>
                <img src="asset/button_rules.png" class="leftRotate" alt="">
            </div>
            <div>
                <h3>
                    Credits
                </h3>
                <img src="asset/button_credits.png" class="leftRotate" alt="">

            <div>
                <h3>
                    Settings
                </h3>
                <img src="asset/button_settings.png" class="rightRotate" alt="">

    <main>
        <section class="gameArea">

    <footer>

    </footer>
